version: '3.8'

services:
  apachewatch:
    build: .
    container_name: apachewatch
    ports:
      - "8080:8080"
    volumes:
      # Mount your code for live editing (development mode)
      - .:/app
      # Mount Apache logs (read-only) - adjust these paths for your system
      - /var/log/apache2:/logs:ro
      # Persist data outside container
      - ./data:/app/data
    environment:
      - APACHEWATCH_SMTP_HOST=${APACHEWATCH_SMTP_HOST:-}
      - APACHEWATCH_SMTP_PORT=${APACHEWATCH_SMTP_PORT:-587}
      - APACHEWATCH_SMTP_SECURITY=${APACHEWATCH_SMTP_SECURITY:-starttls}
      - APACHEWATCH_SMTP_USERNAME=${APACHEWATCH_SMTP_USERNAME:-}
      - APACHEWATCH_SMTP_PASSWORD=${APACHEWATCH_SMTP_PASSWORD:-}
      - APACHEWATCH_EMAIL_FROM=${APACHEWATCH_EMAIL_FROM:-}
      - APACHEWATCH_PUBLIC_URL=${APACHEWATCH_PUBLIC_URL:-}
    restart: unless-stopped
    # Starts the web server and its background monitoring worker.
    command: python apachewatch.py

# For macOS/Windows users who don't have Apache locally:
# Comment out the /var/log/apache2 mount above and create a dummy log:
#   mkdir -p logs
#   touch logs/error.log
# Then use: - ./logs:/logs:ro
